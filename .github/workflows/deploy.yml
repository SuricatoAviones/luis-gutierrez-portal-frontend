name: Build & Deploy Astro to cPanel

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-update]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build
        env:
          WP_API_URL: ${{ secrets.WORDPRESS_API_URL }}

      - name: Deploy to cPanel via FTP (lftp)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          cat <<EOF | lftp -d "$FTP_HOST" -p 21
          user "$FTP_USER" "$FTP_PASS"
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data no
          set ssl:verify-certificate no
          set ftp:fix-pasv-address on
          set ftp:passive-mode on
          set net:timeout 60
          set net:max-retries 2
          set net:reconnect-interval-base 5
          mirror -R --delete --parallel=4 --verbose ./dist/ "$FTP_DIR"
          quit
          EOF