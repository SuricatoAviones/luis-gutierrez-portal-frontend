name: Build & Deploy Astro to cPanel

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-update]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build
        env:
          WP_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          CF7_FORM_ID: ${{ secrets.CF7_FORM_ID }}

      - name: Deploy to cPanel via SSH (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_SERVER }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: 22
          SOURCE: "dist/"
          TARGET: ${{ secrets.SSH_DESTINATION_PATH }}
          ARGS: "-rlgoDzvc --delete"