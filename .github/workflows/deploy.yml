name: Build & Deploy Astro to cPanel

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-update]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build
        env:
          WP_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          CF7_FORM_ID: ${{ secrets.CF7_FORM_ID }}

      - name: Deploy to cPanel via FTPS (lftp)
        env:
          FTP_HOST: ftp.luisangelgutierrez.com
          FTP_USER: deploy@luisangelgutierrez.com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          cat <<EOF | lftp -d -p 21 "$FTP_HOST"
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          user "$FTP_USER" "$FTP_PASS"
          mirror -R --delete --parallel=2 --verbose ./dist/ "$FTP_DIR"
          quit
          EOF