name: Build & Deploy Astro to cPanel

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-update]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build
        env:
          WP_API_URL: ${{ secrets.WORDPRESS_API_URL }}

      - name: Deploy to cPanel via SSH (rsync)
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: ${{ secrets.SSH_SERVER }}
          remote-user: ${{ secrets.SSH_USERNAME }}
          private-ssh-key: ${{ secrets.SSH_KEY }}
          destination-path: ${{ secrets.SSH_DESTINATION_PATH }}
          source-path: ./dist/
          ssh-port: 22